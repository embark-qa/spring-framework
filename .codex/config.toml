[features]
hooks = true

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '''f="${AIR_ARTIFACTS_WATCH_LIST:-/home/workspace/.config/JetBrains/Air/artifacts.watch}"; [ -f "$f" ] || exit 0; d="${CODEX_HOME:-$HOME/.codex}/sessions"; mkdir -p "$d"; grep -qxF "$d/**" "$f" || echo "$d/**" >> "$f"'''
timeout = 5
